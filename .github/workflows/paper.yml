name: paper

# NOT ARMED. docs/DESIGN.md "Graduation ladder": paper trading begins only after
# the SAME champion has survived three consecutive weekly deep evals. There is no
# champion at all yet, run_paper.py is Phase 7, and a cron line that fired into
# that state would submit orders for a strategy nothing has approved.
#
# The schedule below is therefore commented out, deliberately and visibly, rather
# than deleted: weekdays 13:00 UTC = 09:00 ET, well before the 09:30 open auction
# so MOO orders land even with Actions cron jitter.
on:
  # schedule:
  #   - cron: "0 13 * * 1-5"      # armed at paper graduation — Phase 7
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arena-state
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Verify before trading anything
        # The same gate the other two workflows take, and the one that matters
        # most here: this is the workflow that will one day place real orders.
        run: python verify.py

      - name: Paper session (dry)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ ! -f run_paper.py ]; then
            echo "run_paper.py does not exist yet — it is Phase 7 (broker_paper.py,"
            echo "run_paper.py, the tracking ledger). This workflow is the slot it"
            echo "will land in, dispatch-only until then. Nothing to do; exiting 0."
            exit 0
          fi
          python run_paper.py --dry
